name: Sync Plugin Template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v0.1.10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Core → plugin-template
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Making plugin-template exactly match $TAG"

          # Move to the template branch (create it if missing)
          git checkout -B plugin-template

          # Hard-reset so the branch is identical to the release tag
          git reset --hard "$TAG"

          # Record which core version this template is based on
          echo "$TAG" > .core-version
          git add .core-version
          git commit -m "chore: sync plugin-template to $TAG" || true

          # Clear the GITHUB_TOKEN header injected by actions/checkout
          git config --unset-all http.https://github.com/.extraheader || true

          # Push with PAT (required for workflow files + force update)
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin plugin-template