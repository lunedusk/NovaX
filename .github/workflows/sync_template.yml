name: Sync Plugin Template

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a new core release tag

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Core to Template
        run: |
          git checkout plugin-template
          git merge ${{ github.ref_name }} --no-edit -X theirs -m "chore: sync plugin-template with release ${{ github.ref_name }}"
          
          # Create/Update the core-version index file for the template
          echo "${{ github.ref_name }}" > .core-version
          git add .core-version
          git commit -m "chore: update .core-version index to ${{ github.ref_name }}" || true
          
          git push origin plugin-template