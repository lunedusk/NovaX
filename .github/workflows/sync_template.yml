name: Sync Plugin Template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v0.1.10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Sync Core → plugin-template
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          echo "Syncing plugin-template to $TAG"

          git checkout plugin-template

          git merge "$TAG" --no-edit -X theirs \
            -m "chore: sync plugin-template with core $TAG"

          echo "$TAG" > .core-version
          git add .core-version
          git commit -m "chore: update .core-version to $TAG" || true

          # Remove the GITHUB_TOKEN auth header that checkout injected
          git config --unset-all http.https://github.com/.extraheader || true

          # Now push with the PAT
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin plugin-template