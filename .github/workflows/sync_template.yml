name: Sync Plugin Template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v0.1.10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Core → plugin-template
        run: |
          set -euo pipefail

          # Use the input when called via workflow_dispatch, otherwise use the tag that triggered us
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          echo "Syncing plugin-template to $TAG"

          git checkout plugin-template

          git merge "$TAG" --no-edit -X theirs \
            -m "chore: sync plugin-template with core $TAG"

          echo "$TAG" > .core-version
          git add .core-version
          git commit -m "chore: update .core-version to $TAG" || true

          git push origin plugin-template