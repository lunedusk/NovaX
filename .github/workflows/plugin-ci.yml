name: Plugin CI & Auto-Tag

on:
  push:
    branches:
      - 'plugin-*'
    paths:
      - 'src/plugins/**/manifest.json'
      - 'src/plugins/**/manifest.nvx'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin id (folder under src/plugins/)'
        required: true

permissions:
  contents: write

jobs:
  validate-pack-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plugin Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub-hosted runners; 22 matches engines >=20
          node-version: '22'

      - name: Resolve plugin name
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLUGIN_NAME="${{ github.event.inputs.plugin }}"
          else
            PLUGIN_NAME=${GITHUB_REF_NAME#plugin-}
          fi
          echo "plugin=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"
          MANIFEST="src/plugins/${PLUGIN_NAME}/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ manifest.json not found at $MANIFEST"
            exit 1
          fi
          PLUGIN_VERSION=$(jq -r .version "$MANIFEST")
          if [ -z "$PLUGIN_VERSION" ] || [ "$PLUGIN_VERSION" = "null" ]; then
            echo "❌ Could not read version from manifest"
            exit 1
          fi
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin=${PLUGIN_NAME} version=${PLUGIN_VERSION}"

      - name: Install, typecheck & build
        run: |
          set -euo pipefail
          npm install
          npx tsc --noEmit
          # pack script is: node --import ./core/dependency/index.mjs ./scripts/manifestPacker.js
          # those paths only exist after compile + copy-assets
          npm run build
          test -f core/dependency/index.mjs
          test -f scripts/manifestPacker.js

      - name: Pack signed .nvx
        env:
          PrivateKey: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          if [ -z "${PrivateKey:-}" ] && [ -z "${PLUGIN_SIGNING_KEY:-}" ]; then
            echo "❌ PLUGIN_SIGNING_KEY secret is required to sign manifest.nvx"
            exit 1
          fi
          export PrivateKey="${PrivateKey:-$PLUGIN_SIGNING_KEY}"
          export PLUGIN_SIGNING_KEY="${PLUGIN_SIGNING_KEY:-$PrivateKey}"

          npm run pack -- "$PLUGIN"

          if [ -f "src/plugins/${PLUGIN}/manifest.nvx" ]; then
            echo "✅ Signed: src/plugins/${PLUGIN}/manifest.nvx"
          elif [ -f "plugins/${PLUGIN}/manifest.nvx" ]; then
            mkdir -p "src/plugins/${PLUGIN}"
            cp "plugins/${PLUGIN}/manifest.nvx" "src/plugins/${PLUGIN}/manifest.nvx"
            echo "✅ Copied .nvx into src/plugins/${PLUGIN}/"
          else
            echo "❌ manifest.nvx was not produced"
            echo "Looked for src/plugins/${PLUGIN}/manifest.nvx and plugins/${PLUGIN}/manifest.nvx"
            ls -la "src/plugins/${PLUGIN}" 2>/dev/null || true
            ls -la "plugins/${PLUGIN}" 2>/dev/null || true
            exit 1
          fi

      - name: Commit .nvx if changed
        run: |
          set -euo pipefail
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/plugins/${PLUGIN}/manifest.nvx" || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(plugin): sign ${PLUGIN} manifest.nvx"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "No .nvx changes to commit"
          fi

      - name: Auto-Tag Plugin Version
        if: success()
        run: |
          set -euo pipefail

          PLUGIN_NAME="${{ steps.meta.outputs.plugin }}"
          PLUGIN_VERSION="${{ steps.meta.outputs.version }}"
          TAG_NAME="plugin-${PLUGIN_NAME}-v${PLUGIN_VERSION}"
          echo "Creating tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists – skipping"
          else
            git tag -a "$TAG_NAME" -m "Plugin ${PLUGIN_NAME} v${PLUGIN_VERSION}"
            git push origin "$TAG_NAME"
          fi