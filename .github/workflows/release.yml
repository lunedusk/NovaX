name: Master Auto Tag & Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Analyze Version Change
        id: version_check
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r .version)
          NEW_VERSION=$(jq -r .version package.json)
          
          if [ "$OLD_VERSION" == "$NEW_VERSION" ]; then
            echo "Version did not change. Skipping."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          OLD_MAJOR=$(echo $OLD_VERSION | cut -d. -f1)
          OLD_MINOR=$(echo $OLD_VERSION | cut -d. -f2)
          NEW_MAJOR=$(echo $NEW_VERSION | cut -d. -f1)
          NEW_MINOR=$(echo $NEW_VERSION | cut -d. -f2)
          
          if [ "$OLD_MAJOR" == "$NEW_MAJOR" ] && [ "$OLD_MINOR" == "$NEW_MINOR" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- FETCH AND ISOLATE PLUGINS (WITH SOFTFAIL) ---
      - name: Fetch and Clean Plugins
        if: steps.version_check.outputs.changed == 'true'
        run: |
          mkdir -p src/plugins
          
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            
            echo "Fetching plugin branch: $branch"
            PLUGIN_NAME=${branch#plugin-}
            
            git clone --branch "$branch" --single-branch https://github.com/${{ github.repository }}.git temp_plugin
            
            # SOFTFAIL VALIDATION
            if [ ! -f "temp_plugin/src/plugins/$PLUGIN_NAME/manifest.json" ]; then
              echo "⚠️ SOFTFAIL: No manifest.json found at 'src/plugins/$PLUGIN_NAME/' in branch '$branch'. Skipping this branch."
              rm -rf temp_plugin
              continue
            fi
            
            # Inject only the specific plugin folder
            mv "temp_plugin/src/plugins/$PLUGIN_NAME" "src/plugins/$PLUGIN_NAME"
            rm -rf temp_plugin
            
            echo "✅ Successfully injected plugin: $PLUGIN_NAME"
          done < plugins.txt

      # --- SMART DOCS UPDATE ---
      - name: Smart Update Docs & References
        if: steps.version_check.outputs.changed == 'true'
        env:
          OLD_VER: ${{ steps.version_check.outputs.old_version }}
          NEW_VER: ${{ steps.version_check.outputs.version }}
        run: |
          npm install
          npm ci
          npm run docs
          node -e "
          const fs = require('fs');
          const oldVer = process.env.OLD_VER;
          const newVer = process.env.NEW_VER;
          const files = fs.readdirSync('.').filter(f => f.endsWith('.md'));
          for (const file of files) {
            let content = fs.readFileSync(file, 'utf8');
            const regex = new RegExp('(?<!\\\\d)' + oldVer.replace(/\\./g, '\\\\.') + '(?!\\\\d)', 'g');
            if (regex.test(content)) {
              content = content.replace(regex, newVer);
              fs.writeFileSync(file, content);
            }
          }
          "

      # --- BUILD, CLEAN, AND ZIP ---
      - name: Build and Package
        if: steps.version_check.outputs.changed == 'true'
        run: |
          npx tsc
          mkdir release_build
          rsync -avm --include='*.js' --include='*.json' --include='*/' --exclude='*' src/ release_build/src/
          cp package.json package-lock.json release_build/
          
          cd release_build
          npm install
          npm ci --omit=dev
          find . -name "*.d.ts" -type f -delete
          
          zip -r ../NovaX-v${{ steps.version_check.outputs.version }}.zip .
          cd ..

      # --- UPLOAD ARTIFACT ---
      - name: Upload Artifact to GitHub Action
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NovaX-Compiled-v${{ steps.version_check.outputs.version }}
          path: NovaX-v${{ steps.version_check.outputs.version }}.zip

      # --- IMPORT GPG KEY ---
      - name: Import GPG Key
        if: steps.version_check.outputs.changed == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true

      # --- COMMIT, TAG & PUBLISH ---
      - name: Commit, Tag & Publish Release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_check.outputs.version }}
          IS_PRERELEASE: ${{ steps.version_check.outputs.is_prerelease }}
        run: |
          TAG_NAME="v$VERSION"
          git add docs/ *.md plugins.txt
          
          if ! git diff --cached --quiet; then
            git commit -S -m "[CHORE] Update Docs & Version References to $TAG_NAME"
          fi
          
          git tag -s $TAG_NAME -m "Release $TAG_NAME"
          git push origin main
          git push origin $TAG_NAME
          
          ZIP_FILE="NovaX-$TAG_NAME.zip"
          
          if [ "$IS_PRERELEASE" == "true" ]; then
            gh release create $TAG_NAME $ZIP_FILE --prerelease --title "$TAG_NAME Pre-release" --generate-notes
          else
            gh release create $TAG_NAME $ZIP_FILE --title "$TAG_NAME Latest" --generate-notes
          fi